name: Build Windows exe

on:
  push:
    tags:
      - 'v*'

# The release-publish step needs this. Without it the build fails with
# "Resource not accessible by integration" (learned the hard way on v1).
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build exe with PyInstaller
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name AudiobookOrganizer main.py

      - name: Fail the build if any of the app's own modules are missing
        # PyInstaller only WARNS about a missing module and still produces
        # the exe, which then dies at startup with ModuleNotFoundError.
        # (v2.1.0 shipped without config.py exactly this way.) Catch it here
        # so a broken build fails loudly instead of shipping a dead exe.
        run: |
          $warn = Get-ChildItem -Path build -Recurse -Filter "warn-*.txt" | Select-Object -First 1
          $bad = Select-String -Path $warn.FullName -Pattern "missing module named (config|db|backend|gui)"
          if ($bad) {
            $bad.Line | ForEach-Object { Write-Host $_ }
            Write-Error "Build is missing one of the app's own modules - failing instead of shipping a dead exe."
            exit 1
          }
          Write-Host "All app modules present in the bundle."

      - name: Upload exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudiobookOrganizer-windows
          path: dist/AudiobookOrganizer.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AudiobookOrganizer.exe
