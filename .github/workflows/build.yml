name: Build Windows exe

on:
  push:
    tags:
      - 'v*'

# The release-publish step needs this. Without it the build fails with
# "Resource not accessible by integration" (learned the hard way on v1).
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build exe with PyInstaller
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name AudiobookOrganizer main.py

      - name: Upload exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudiobookOrganizer-windows
          path: dist/AudiobookOrganizer.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AudiobookOrganizer.exe
